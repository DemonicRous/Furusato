name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LimeCore-0.2.0
          path: build/libs/*.jar
          if-no-files-found: error
